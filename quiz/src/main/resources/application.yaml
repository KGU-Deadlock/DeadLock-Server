server:
  port: ${QUIZ_SERVICE_PORT}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: quiz-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${QUIZ_POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

service:
  user:
    url: ${USER_SERVICE_URL}
  topic:
    url: ${TOPIC_SERVICE_URL}
  grading:
    url: ${GRADING_SERVICE_URL}

logging:
  level:
    root: INFO

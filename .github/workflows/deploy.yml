name: Deploy to Backend (Docker Compose)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
  DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}

jobs:
  deploy:
    runs-on: [self-hosted, dev-deadlock]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        shell: bash
        run: docker build -t deadlock-server:latest .

      - name: Transfer image to backend
        shell: bash
        run: docker save deadlock-server:latest | ssh -o StrictHostKeyChecking=no $BACKEND_HOST docker load

      - name: Prepare .env
        shell: bash
        run: |
          {
            echo "COMPOSE_PROJECT_NAME=deadlock-server"
            echo "JAVA_OPTS=${{ secrets.JAVA_OPTS }}"
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
            echo "REDIS_TIMEOUT=${{ secrets.REDIS_TIMEOUT }}"
            echo "MONGO_DB=${{ secrets.MONGO_DB }}"
            echo "MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}"
            echo "MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}"
            echo "MONGO_URI=${{ secrets.MONGO_URI }}"
            echo "KAKAO_APP_ID=${{ secrets.KAKAO_APP_ID }}"
            echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}"
            echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}"
            echo "KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}"
            echo "KAKAO_FRONT_REDIRECT_URI=${{ secrets.KAKAO_FRONT_REDIRECT_URI }}"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "JWT_ACCESS_TOKEN_EXPIRATION=${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}"
            echo "JWT_REFRESH_TOKEN_EXPIRATION=${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}"
            echo "AI_GRADING_EVALUATE_ENDPOINT=${{ secrets.AI_GRADING_EVALUATE_ENDPOINT }}"
            echo "AI_STT_TRANSCRIBE_ENDPOINT=${{ secrets.AI_STT_TRANSCRIBE_ENDPOINT }}"
            echo "AI_INTERVIEW_FEEDBACK_ENDPOINT=${{ secrets.AI_INTERVIEW_FEEDBACK_ENDPOINT }}"
            echo "GRAFANA_ROOT_URL=${{ secrets.GRAFANA_ROOT_URL }}"
            echo "GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}"
            echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
          } > .env

      - name: Deploy to backend
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no $BACKEND_HOST "mkdir -p $DEPLOY_DIR"
          scp -o StrictHostKeyChecking=no docker-compose.yml .env $BACKEND_HOST:$DEPLOY_DIR/
          ssh -o StrictHostKeyChecking=no $BACKEND_HOST "cd $DEPLOY_DIR && docker compose up -d && docker compose ps"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f .env
          docker image prune -f

      - name: Notify Discord (success)
        if: success()
        shell: bash
        run: |
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"✅ [Backend] Deploy success: \`${{ github.repository }}@$(echo ${{ github.sha }} | cut -c1-7)\` (${GITHUB_REF_NAME})\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord (failure)
        if: failure()
        shell: bash
        run: |
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"❌ [Backend] Deploy failed: \`${{ github.repository }}@$(echo ${{ github.sha }} | cut -c1-7)\`\\nActions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
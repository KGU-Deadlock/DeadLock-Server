name: Deploy to Pi (Docker Compose)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, pi-ops]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images on bastion
        shell: bash
        run: |
          docker build -t deadlock-user-service:latest -f user/Dockerfile .
          docker build -t deadlock-topic-service:latest -f topic/Dockerfile .
          docker build -t deadlock-quiz-service:latest -f quiz/Dockerfile .
          docker build -t deadlock-interview-service:latest -f interview/Dockerfile .
          docker build -t deadlock-ranking-service:latest -f ranking/Dockerfile .
          docker build -t deadlock-streak-service:latest -f streak/Dockerfile .
          docker build -t deadlock-gateway:latest -f gateway/Dockerfile .

      - name: Transfer images to backend
        shell: bash
        run: |
          for img in \
            deadlock-user-service:latest \
            deadlock-topic-service:latest \
            deadlock-quiz-service:latest \
            deadlock-interview-service:latest \
            deadlock-ranking-service:latest \
            deadlock-streak-service:latest \
            deadlock-gateway:latest; do
            docker save "$img" | gzip | \
              ssh -o StrictHostKeyChecking=no ubuntu@192.168.123.102 \
              "gunzip | docker load"
          done

      - name: Deploy on backend
        shell: bash
        run: |
          ssh ubuntu@192.168.123.102 "cd ~/DeadLock-Server && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-build"

      - name: Notify Discord (success)
        if: success()
        shell: bash
        run: |
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"✅ [Backend] Deploy success: \`${{ github.repository }}@$(echo ${{ github.sha }} | cut -c1-7)\` (${GITHUB_REF_NAME})\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord (failure)
        if: failure()
        shell: bash
        run: |
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"❌ [Backend] Deploy failed: \`${{ github.repository }}@$(echo ${{ github.sha }} | cut -c1-7)\`\\nActions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

name: Deploy to Pi (Docker Compose)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, pi-ops]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image on bastion
        shell: bash
        run: |
          docker build -t deadlock-server:latest .

      - name: Transfer image to backend
        shell: bash
        run: |
          docker save deadlock-server:latest | gzip | \
            ssh -o StrictHostKeyChecking=no ubuntu@192.168.123.102 \
            "gunzip | docker load"

      - name: Deploy on backend
        shell: bash
        run: |
          ssh ubuntu@192.168.123.102 "cd ~/DeadLock-Server && docker compose up -d --no-build"

      - name: Notify Discord (success)
        if: success()
        shell: bash
        run: |
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"✅ [Backend] Deploy success: \`${{ github.repository }}@${{ github.sha }}\` (${GITHUB_REF_NAME})\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord (failure)
        if: failure()
        shell: bash
        run: |
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"❌ [Backend] Deploy failed: \`${{ github.repository }}@${{ github.sha }}\`\\nActions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
name: 🚀 기능 구현
description: API 설계 외에 필요한 기능을 구현합니다.
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: textarea
    id: tasks
    attributes:
      label: ✅ Implementation Tasks
      description: 구현해야 할 세부 작업
      placeholder: |
        - [ ] Controller 및 DTO 정의
        - [ ] Service 비즈니스 로직 구현
        - [ ] 테스트 코드 (Unit/Integration) 작성
      validations:
        required: false

  - type: textarea
    id: description
    attributes:
      label: 📝 Implementation Notes / Context
      description: |
        구현 시 참고할 특이사항, 비즈니스 로직 제약, Figma/Wiki 링크 등을 자유롭게 작성하세요.
      placeholder: |
        - 회원 가입 시 이메일 중복 체크 로직은 기존 MemberValidator 재사용 필수.
        - 기획서 링크: https://figma.com/...
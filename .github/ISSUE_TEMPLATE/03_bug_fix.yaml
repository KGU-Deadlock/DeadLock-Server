name: 🐛 Bug Report (Fast Track)
description: Trace ID 기반의 신속한 버그 리포트.
title: "[FIX] "
labels: ["bug"]
body:
  - type: input
    id: trace-id
    attributes:
      label: 🔍 Trace ID (Required)
      description: 서버 로그의 `traceId`를 입력 해주세요.
      placeholder: "e.g., 65a12f8b99c43833"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🔥 Severity
      options:
        - P0 (Critical - 서비스 중단)
        - P1 (High - 주요 기능 장애)
        - P2 (Normal - 일반 버그)
        - P3 (Low - 마이너/UI)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 Simple Description / Logs
      description: 현상이나 로그를 자유롭게 남겨주세요.
      placeholder: "로그인 시 500 에러 발생. 로그 첨부함."
    validations:
      required: true
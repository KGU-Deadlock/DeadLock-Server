name: 🛠 Chore & Maintenance
description: 빌드 환경, 라이브러리 버전 관리, 문서화 작업.
title: "[CHORE] "
labels: ["chore"]
body:
  - type: input
    id: subject
    attributes:
      label: 📝 Subject
      placeholder: "e.g., Spring Boot 3.2.2 Upgrade"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 📋 Details
      description: 변경 사항과 영향 범위를 작성하세요.
      placeholder: |
        - CVE-xxxx 보안 취약점으로 인한 Jackson 라이브러리 버전 업 (2.14 -> 2.15)
        - build.gradle 수정 및 의존성 트리 점검 완료
    validations:
      required: true
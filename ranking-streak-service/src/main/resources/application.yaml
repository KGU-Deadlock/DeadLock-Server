server:
  port: ${SERVER_PORT}
  shutdown: graceful

spring:
  application:
    name: ranking-streak-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}

  mongodb:
    uri: ${MONGO_URI}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ranking-streak-group

jwt:
  secret: ${JWT_SECRET}

core-service:
  base-url: ${CORE_SERVICE_BASE_URL}

management:
  server:
    port: ${MANAGEMENT_PORT}
    address: 0.0.0.0
  endpoints:
    access:
      default: none
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      access: unrestricted
      probes:
        enabled: true
      show-details: never
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ranking-streak-service
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO

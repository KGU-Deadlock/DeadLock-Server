################################################################################
# HelloCS — Perf Bake (독립 Compose)
#
# 데이터셋 생성 전용. 성능 측정용 리소스 제한 없음 — 최대한 빠르게 굽는 것이 목표.
# perf 테스트(run.ps1)는 docker-compose.perf.yml 만 사용한다.
#
# docker-compose.perf.yml 과 독립적으로 구성되므로 오버라이드 머지 없음.
# interview-service / stt-service 도 bake 에 포함 (perf baseline 에서만 제외).
#
# 사용:
#   wsl env "DATASET=" docker compose -p hellocs-bake --env-file .env.perf \
#     -f docker-compose.perf.bake.yml --profile app up -d --build
#
# DATASET="" 로 기동하면 02-load-dataset.sh / redis-seed.sh / mongo-seed.sh 모두 no-op.
################################################################################

# ── 공통 프래그먼트 (YAML 앵커) ───────────────────────────────────────────────

# 인프라 헬스체크 — 빠른 감지, start_period 불필요 (DB/MQ 는 기동이 빠름)
x-infra-health: &infra-health
  interval: 5s
  timeout: 5s
  retries: 20

# 앱 헬스체크 — JVM 워밍업을 고려한 start_period, 감지 인터벌은 단축
x-app-health: &app-health
  interval: 3s
  timeout: 5s
  retries: 30
  start_period: 30s

services:

  # ─────────────────────────────────────────────────────────────
  # 공유 인프라 (리소스 제한 없음)
  # ─────────────────────────────────────────────────────────────

  rabbitmq:
    profiles: [app]
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      <<: *infra-health

  redis:
    profiles: [app]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    volumes:
      - redis-bake-data:/data
    depends_on:
      redis-seeder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *infra-health

  mongo:
    profiles: [app]
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-bake-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ─── 서비스별 전용 Postgres (bake 는 성능 분석 불필요 — 쿼리 로깅/stat 미적용) ──

  postgres-user:
    profiles: [app]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASET: ${DATASET}
      DATASET_PG_FILE: postgres-user.sql
    volumes:
      - postgres-user-bake-data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./ops/perf/datasets:/perf-datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_POSTGRES_DB}"]
      <<: *infra-health

  postgres-topic:
    profiles: [app]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TOPIC_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASET: ${DATASET}
      DATASET_PG_FILE: postgres-topic.sql
    volumes:
      - postgres-topic-bake-data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./ops/perf/datasets:/perf-datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TOPIC_POSTGRES_DB}"]
      <<: *infra-health

  postgres-quiz:
    profiles: [app]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${QUIZ_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASET: ${DATASET}
      DATASET_PG_FILE: postgres-quiz.sql
    volumes:
      - postgres-quiz-bake-data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./ops/perf/datasets:/perf-datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${QUIZ_POSTGRES_DB}"]
      <<: *infra-health

  postgres-interview:
    profiles: [app]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${INTERVIEW_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASET: ${DATASET}
      DATASET_PG_FILE: postgres-interview.sql
    volumes:
      - postgres-interview-bake-data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./ops/perf/datasets:/perf-datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${INTERVIEW_POSTGRES_DB}"]
      <<: *infra-health

  # ─── 시딩 ────────────────────────────────────────────────────

  redis-seeder:
    profiles: [app]
    image: redis:7.4-alpine
    environment:
      DATASET: ${DATASET}
    entrypoint: ["sh", "/seed/redis-seed.sh"]
    volumes:
      - redis-bake-data:/data
      - ./ops/perf/datasets:/perf-datasets:ro
      - ./ops/perf/seeders/redis-seed.sh:/seed/redis-seed.sh:ro

  mongo-seeder:
    profiles: [app]
    image: mongo:8.0
    environment:
      DATASET: ${DATASET}
    entrypoint: ["bash", "/seed/mongo-seed.sh"]
    volumes:
      - ./ops/perf/datasets:/perf-datasets:ro
      - ./ops/perf/seeders/mongo-seed.sh:/seed/mongo-seed.sh:ro
    depends_on:
      mongo:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # 마이크로서비스 (리소스 제한 없음)
  # ─────────────────────────────────────────────────────────────

  user-service:
    profiles: [app]
    build:
      context: .
      dockerfile: user/Dockerfile
    image: deadlock-user-service:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8081
      MANAGEMENT_PORT: 8091
      POSTGRES_HOST: postgres-user
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${USER_POSTGRES_DB}
      USER_SERVICE_URL: http://user-service:8081
      TOPIC_SERVICE_URL: http://topic-service:8082
      TEMPO_HOST: tempo
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8091/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  topic-service:
    profiles: [app]
    build:
      context: .
      dockerfile: topic/Dockerfile
    image: deadlock-topic-service:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8082
      MANAGEMENT_PORT: 8092
      POSTGRES_HOST: postgres-topic
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${TOPIC_POSTGRES_DB}
      TEMPO_HOST: tempo
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      
    depends_on:
      postgres-topic:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8092/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  quiz-service:
    profiles: [app]
    build:
      context: .
      dockerfile: quiz/Dockerfile
    image: deadlock-quiz-service:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8083
      MANAGEMENT_PORT: 8093
      POSTGRES_HOST: postgres-quiz
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${QUIZ_POSTGRES_DB}
      USER_SERVICE_URL: http://user-service:8081
      TOPIC_SERVICE_URL: http://topic-service:8082
      TEMPO_HOST: tempo
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      
    depends_on:
      postgres-quiz:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
      topic-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8093/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  interview-service:
    profiles: [app]
    build:
      context: .
      dockerfile: interview/Dockerfile
    image: deadlock-interview-service:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8084
      MANAGEMENT_PORT: 8094
      POSTGRES_HOST: postgres-interview
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${INTERVIEW_POSTGRES_DB}
      TEMPO_HOST: tempo
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      
    depends_on:
      postgres-interview:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8094/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  ranking-service:
    profiles: [app]
    build:
      context: .
      dockerfile: ranking/Dockerfile
    image: deadlock-ranking-service:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8085
      MANAGEMENT_PORT: 8095
      USER_SERVICE_URL: http://user-service:8081
      TEMPO_HOST: tempo
      
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8095/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  streak-service:
    profiles: [app]
    build:
      context: .
      dockerfile: streak/Dockerfile
    image: deadlock-streak-service:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8086
      MANAGEMENT_PORT: 8096
      TEMPO_HOST: tempo
      
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8096/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  grading-service:
    profiles: [app]
    build:
      context: .
      dockerfile: grading/Dockerfile
    image: deadlock-grading-service:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8087
      MANAGEMENT_PORT: 8097
      GRADING_SERVICE_PORT: 8087
      TOPIC_SERVICE_URL: http://topic-service:8082
      QUIZ_SERVICE_URL: http://quiz-service:8083
      TEMPO_HOST: tempo
      
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8097/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  stt-service:
    profiles: [app]
    build:
      context: .
      dockerfile: stt/Dockerfile
    image: deadlock-stt-service:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8088
      MANAGEMENT_PORT: 8098
      STT_SERVICE_PORT: 8088
      TEMPO_HOST: tempo
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8098/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  gateway:
    profiles: [app]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: deadlock-gateway:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8080
      MANAGEMENT_PORT: 8081
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 8081
      TOPIC_SERVICE_HOST: topic-service
      TOPIC_SERVICE_PORT: 8082
      QUIZ_SERVICE_HOST: quiz-service
      QUIZ_SERVICE_PORT: 8083
      INTERVIEW_SERVICE_HOST: interview-service
      INTERVIEW_SERVICE_PORT: 8084
      RANKING_SERVICE_HOST: ranking-service
      RANKING_SERVICE_PORT: 8085
      STREAK_SERVICE_HOST: streak-service
      STREAK_SERVICE_PORT: 8086
      GRADING_SERVICE_HOST: grading-service
      GRADING_SERVICE_PORT: 8087
      STT_SERVICE_HOST: stt-service
      STT_SERVICE_PORT: 8088
      DEV_SERVICE_HOST: dev-service
      DEV_SERVICE_PORT: 8090
      TEMPO_HOST: tempo
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      user-service:
        condition: service_healthy
      topic-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
      ranking-service:
        condition: service_healthy
      streak-service:
        condition: service_healthy
      grading-service:
        condition: service_healthy
      dev-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  dev-service:
    profiles: [app]
    build:
      context: .
      dockerfile: dev/Dockerfile
    image: deadlock-dev-service:bake
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      DEV_SERVICE_PORT: 8090
      MANAGEMENT_PORT: 8099
      USER_SERVICE_URL: http://user-service:8081
      TOPIC_SERVICE_URL: http://topic-service:8082
      QUIZ_SERVICE_URL: http://quiz-service:8083
      INTERVIEW_SERVICE_URL: http://interview-service:8084
      GRADING_SERVICE_URL: http://grading-service:8087
      STREAK_SERVICE_URL: http://streak-service:8086
      RANKING_SERVICE_URL: http://ranking-service:8085
      TEMPO_HOST: tempo
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
      topic-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
      grading-service:
        condition: service_healthy
      streak-service:
        condition: service_healthy
      ranking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8099/actuator/health/readiness > /dev/null || exit 1"]
      <<: *app-health

  # ── 부하테스트 지원 ────────────────────────────────────────────
  # grading-service 의 AI 채점이 WireMock 을 통하므로 bake 에도 필요
  wiremock:
    profiles: [app]
    image: wiremock/wiremock:3.9.1
    restart: always
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./ops/wiremock/mappings:/home/wiremock/mappings:ro
    ports:
      - "8089:8080"

volumes:
  redis-bake-data:
  mongo-bake-data:
  postgres-user-bake-data:
  postgres-topic-bake-data:
  postgres-quiz-bake-data:
  postgres-interview-bake-data:

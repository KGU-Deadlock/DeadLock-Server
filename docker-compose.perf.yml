name: hellocs-perf

################################################################################
# HelloCS — Perf MSA Compose
# 서비스: gateway | user-service | topic-service | quiz-service |
#          interview-service | ranking-service | streak-service
# 인프라: 서비스별 전용 Postgres, 공유 Redis/Mongo/RabbitMQ
# 모니터링: prometheus / grafana / cadvisor / node-exporter / tempo
# 부하테스트: wiremock / seeders / exporters
#
# 실행:
#   --profile app          → 인프라 + 앱 서비스
#   --profile monitoring   → 모니터링 스택
#   --profile app --profile monitoring → 전체
################################################################################

services:

  # ─────────────────────────────────────────────────────────────
  # 공유 인프라
  # ─────────────────────────────────────────────────────────────

  rabbitmq:
    profiles: [app]
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    command: >
      sh -c "echo '[rabbitmq_management,rabbitmq_prometheus].' > /etc/rabbitmq/enabled_plugins
      && rabbitmq-server"
    deploy:
      resources:
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-0}
          cpus: '${RABBITMQ_CPU_LIMIT:-0}'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    profiles: [app]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    volumes:
      - redis-perf-data:/data
    depends_on:
      redis-seeder:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-0}
          cpus: '${REDIS_CPU_LIMIT:-0}'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    profiles: [app]
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-perf-data:/data/db
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEMORY_LIMIT:-0}
          cpus: '${MONGO_CPU_LIMIT:-0}'
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── 서비스별 전용 Postgres ───────────────────────────────

  postgres-user:
    profiles: [app]
    image: postgres:17-alpine
    command:
      - "postgres"
      - "-c"
      - "log_min_duration_statement=100"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASET: ${DATASET}
      DATASET_PG_FILE: postgres-user.sql
    volumes:
      - postgres-user-perf-data:/var/lib/postgresql/data
      - type: volume
        source: perf-config
        target: /docker-entrypoint-initdb.d
        read_only: true
        volume:
          subpath: postgres/init
      - perf-datasets:/perf-datasets:ro
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_USER_MEMORY_LIMIT:-0}
          cpus: '${POSTGRES_USER_CPU_LIMIT:-0}'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-topic:
    profiles: [app]
    image: postgres:17-alpine
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      POSTGRES_DB: ${TOPIC_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASET: ${DATASET}
      DATASET_PG_FILE: postgres-topic.sql
    volumes:
      - postgres-topic-perf-data:/var/lib/postgresql/data
      - type: volume
        source: perf-config
        target: /docker-entrypoint-initdb.d
        read_only: true
        volume:
          subpath: postgres/init
      - perf-datasets:/perf-datasets:ro
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_TOPIC_MEMORY_LIMIT:-0}
          cpus: '${POSTGRES_TOPIC_CPU_LIMIT:-0}'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TOPIC_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-quiz:
    profiles: [app]
    image: postgres:17-alpine
    command:
      - "postgres"
      - "-c"
      - "log_min_duration_statement=100"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      POSTGRES_DB: ${QUIZ_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASET: ${DATASET}
      DATASET_PG_FILE: postgres-quiz.sql
    volumes:
      - postgres-quiz-perf-data:/var/lib/postgresql/data
      - type: volume
        source: perf-config
        target: /docker-entrypoint-initdb.d
        read_only: true
        volume:
          subpath: postgres/init
      - perf-datasets:/perf-datasets:ro
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_QUIZ_MEMORY_LIMIT:-0}
          cpus: '${POSTGRES_QUIZ_CPU_LIMIT:-0}'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${QUIZ_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-interview:
    profiles: [extra]   # perf baseline 미사용. bake 는 docker-compose.perf.bake.yml 사용.
    image: postgres:17-alpine
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      POSTGRES_DB: ${INTERVIEW_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASET: ${DATASET}
      DATASET_PG_FILE: postgres-interview.sql
    volumes:
      - postgres-interview-perf-data:/var/lib/postgresql/data
      - type: volume
        source: perf-config
        target: /docker-entrypoint-initdb.d
        read_only: true
        volume:
          subpath: postgres/init
      - perf-datasets:/perf-datasets:ro
    deploy:
      resources:
        limits:
          memory: 768m    # hardware.env 미정의 — bake 전용 리터럴 기본값
          cpus: '0.45'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${INTERVIEW_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 시딩 ────────────────────────────────────────────────────

  redis-seeder:
    profiles: [app]
    image: redis:7.4-alpine
    environment:
      DATASET: ${DATASET}
    entrypoint: ["sh", "/seed/redis-seed.sh"]
    volumes:
      - redis-perf-data:/data
      - perf-datasets:/perf-datasets:ro
      - ./ops/perf/seeders/redis-seed.sh:/seed/redis-seed.sh:ro

  mongo-seeder:
    profiles: [app]
    image: mongo:8.0
    environment:
      DATASET: ${DATASET}
    entrypoint: ["bash", "/seed/mongo-seed.sh"]
    volumes:
      - perf-datasets:/perf-datasets:ro
      - ./ops/perf/seeders/mongo-seed.sh:/seed/mongo-seed.sh:ro
    depends_on:
      mongo:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # 마이크로서비스
  # ─────────────────────────────────────────────────────────────

  user-service:
    profiles: [app]
    build:
      context: .
      dockerfile: user/Dockerfile
    image: deadlock-user-service:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8081
      MANAGEMENT_PORT: 8091
      POSTGRES_HOST: postgres-user
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${USER_POSTGRES_DB}
      USER_SERVICE_URL: http://user-service:8081
      TOPIC_SERVICE_URL: http://topic-service:8082
      TEMPO_HOST: tempo
      JAVA_OPTS: "-XX:MaxRAMPercentage=70"
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${USER_MEMORY_LIMIT:-0}
          cpus: '${USER_CPU_LIMIT:-0}'

  topic-service:
    profiles: [app]
    build:
      context: .
      dockerfile: topic/Dockerfile
    image: deadlock-topic-service:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8082
      MANAGEMENT_PORT: 8092
      POSTGRES_HOST: postgres-topic
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${TOPIC_POSTGRES_DB}
      TEMPO_HOST: tempo
      JAVA_OPTS: "-XX:MaxRAMPercentage=70"
    depends_on:
      postgres-topic:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${TOPIC_MEMORY_LIMIT:-0}
          cpus: '${TOPIC_CPU_LIMIT:-0}'

  quiz-service:
    profiles: [app]
    build:
      context: .
      dockerfile: quiz/Dockerfile
    image: deadlock-quiz-service:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8083
      MANAGEMENT_PORT: 8093
      POSTGRES_HOST: postgres-quiz
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${QUIZ_POSTGRES_DB}
      USER_SERVICE_URL: http://user-service:8081
      TOPIC_SERVICE_URL: http://topic-service:8082
      TEMPO_HOST: tempo
      JAVA_OPTS: "-XX:MaxRAMPercentage=70"
    depends_on:
      postgres-quiz:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      topic-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${QUIZ_MEMORY_LIMIT:-0}
          cpus: '${QUIZ_CPU_LIMIT:-0}'

  interview-service:
    profiles: [extra]   # perf baseline 미사용. bake 는 docker-compose.perf.bake.yml 사용.
    build:
      context: .
      dockerfile: interview/Dockerfile
    image: deadlock-interview-service:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8084
      MANAGEMENT_PORT: 8094
      POSTGRES_HOST: postgres-interview
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${INTERVIEW_POSTGRES_DB}
      TEMPO_HOST: tempo
    depends_on:
      postgres-interview:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024m   # hardware.env 미정의 — bake 전용 리터럴 기본값
          cpus: '0.5'

  ranking-service:
    profiles: [app]
    build:
      context: .
      dockerfile: ranking/Dockerfile
    image: deadlock-ranking-service:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8085
      MANAGEMENT_PORT: 8095
      USER_SERVICE_URL: http://user-service:8081
      TEMPO_HOST: tempo
      JAVA_OPTS: "-XX:MaxRAMPercentage=70"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${RANKING_MEMORY_LIMIT:-0}
          cpus: '${RANKING_CPU_LIMIT:-0}'

  streak-service:
    profiles: [app]
    build:
      context: .
      dockerfile: streak/Dockerfile
    image: deadlock-streak-service:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8086
      MANAGEMENT_PORT: 8096
      TEMPO_HOST: tempo
      JAVA_OPTS: "-XX:MaxRAMPercentage=70"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${STREAK_MEMORY_LIMIT:-0}
          cpus: '${STREAK_CPU_LIMIT:-0}'

  grading-service:
    profiles: [app]
    build:
      context: .
      dockerfile: grading/Dockerfile
    image: deadlock-grading-service:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8087
      MANAGEMENT_PORT: 8097
      GRADING_SERVICE_PORT: 8087
      TOPIC_SERVICE_URL: http://topic-service:8082
      QUIZ_SERVICE_URL: http://quiz-service:8083
      TEMPO_HOST: tempo
      JAVA_OPTS: "-XX:MaxRAMPercentage=70"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      quiz-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${GRADING_MEMORY_LIMIT:-0}
          cpus: '${GRADING_CPU_LIMIT:-0}'

  stt-service:
    profiles: [extra]   # perf baseline 미사용. bake 는 docker-compose.perf.bake.yml 사용.
    build:
      context: .
      dockerfile: stt/Dockerfile
    image: deadlock-stt-service:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8088
      MANAGEMENT_PORT: 8098
      STT_SERVICE_PORT: 8088
      TEMPO_HOST: tempo
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024m   # hardware.env 미정의 — bake 전용 리터럴 기본값
          cpus: '0.5'

  gateway:
    profiles: [app]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: deadlock-gateway:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SERVER_PORT: 8080
      MANAGEMENT_PORT: 8081
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 8081
      TOPIC_SERVICE_HOST: topic-service
      TOPIC_SERVICE_PORT: 8082
      QUIZ_SERVICE_HOST: quiz-service
      QUIZ_SERVICE_PORT: 8083
      INTERVIEW_SERVICE_HOST: interview-service
      INTERVIEW_SERVICE_PORT: 8084
      RANKING_SERVICE_HOST: ranking-service
      RANKING_SERVICE_PORT: 8085
      STREAK_SERVICE_HOST: streak-service
      STREAK_SERVICE_PORT: 8086
      GRADING_SERVICE_HOST: grading-service
      GRADING_SERVICE_PORT: 8087
      STT_SERVICE_HOST: stt-service
      STT_SERVICE_PORT: 8088
      DEV_SERVICE_HOST: dev-service
      DEV_SERVICE_PORT: 8090
      TEMPO_HOST: tempo
      JAVA_OPTS: "-XX:MaxRAMPercentage=70"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      user-service:
        condition: service_started
      topic-service:
        condition: service_started
      quiz-service:
        condition: service_started
      ranking-service:
        condition: service_started
      streak-service:
        condition: service_started
      grading-service:
        condition: service_started
      dev-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEMORY_LIMIT:-0}
          cpus: '${GATEWAY_CPU_LIMIT:-0}'

  dev-service:
    profiles: [app]
    build:
      context: .
      dockerfile: dev/Dockerfile
    image: deadlock-dev-service:perf
    env_file:
      - .env.perf
    environment:
      SPRING_PROFILES_ACTIVE: perf
      DEV_SERVICE_PORT: 8090
      MANAGEMENT_PORT: 8099
      USER_SERVICE_URL: http://user-service:8081
      TOPIC_SERVICE_URL: http://topic-service:8082
      QUIZ_SERVICE_URL: http://quiz-service:8083
      INTERVIEW_SERVICE_URL: http://interview-service:8084
      GRADING_SERVICE_URL: http://grading-service:8087
      STREAK_SERVICE_URL: http://streak-service:8086
      RANKING_SERVICE_URL: http://ranking-service:8085
      TEMPO_HOST: tempo
      JAVA_OPTS: "-XX:MaxRAMPercentage=70"   # SUT 예산 외, 토큰 발급 전용
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      topic-service:
        condition: service_started
      quiz-service:
        condition: service_started
      grading-service:
        condition: service_started
      streak-service:
        condition: service_started
      ranking-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${DEV_MEMORY_LIMIT:-0}
          cpus: '${DEV_CPU_LIMIT:-0}'

  # ─── 부하테스트 지원 ────────────────────────────────────────

  wiremock:
    profiles: [app]
    image: wiremock/wiremock:3.9.1
    restart: always
    command: ["--global-response-templating", "--verbose", "--root-dir", "/perf-config/wiremock"]
    volumes:
      - perf-config:/perf-config:ro
    ports:
      - "8089:8080"

  postgres_exporter_user:
    profiles: [app]
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-user:5432/${USER_POSTGRES_DB}?sslmode=disable"
    command:
      - "--extend.query-path=/perf-config/postgres_exporter/queries.yaml"
      - "--collector.stat_statements"
      - "--collector.statio_user_tables"
    volumes:
      - perf-config:/perf-config:ro
    depends_on:
      postgres-user:
        condition: service_healthy

  postgres_exporter_topic:
    profiles: [app]
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-topic:5432/${TOPIC_POSTGRES_DB}?sslmode=disable"
    command:
      - "--extend.query-path=/perf-config/postgres_exporter/queries.yaml"
      - "--collector.stat_statements"
      - "--collector.statio_user_tables"
    volumes:
      - perf-config:/perf-config:ro
    depends_on:
      postgres-topic:
        condition: service_healthy

  postgres_exporter_quiz:
    profiles: [app]
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-quiz:5432/${QUIZ_POSTGRES_DB}?sslmode=disable"
    command:
      - "--extend.query-path=/perf-config/postgres_exporter/queries.yaml"
      - "--collector.stat_statements"
      - "--collector.statio_user_tables"
    volumes:
      - perf-config:/perf-config:ro
    depends_on:
      postgres-quiz:
        condition: service_healthy

  postgres_exporter_interview:
    profiles: [extra]   # perf baseline 미사용. bake 는 docker-compose.perf.bake.yml 사용.
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-interview:5432/${INTERVIEW_POSTGRES_DB}?sslmode=disable"
    command:
      - "--extend.query-path=/perf-config/postgres_exporter/queries.yaml"
      - "--collector.stat_statements"
      - "--collector.statio_user_tables"
    volumes:
      - perf-config:/perf-config:ro
    depends_on:
      postgres-interview:
        condition: service_healthy

  mongodb_exporter:
    profiles: [app]
    image: percona/mongodb_exporter:0.44.0
    command:
      - "--mongodb.uri=mongodb://mongo:27017"
      - "--compatible-mode"
      - "--collect-all"
    depends_on:
      mongo:
        condition: service_healthy

  redis_exporter:
    profiles: [app]
    image: oliver006/redis_exporter:v1.63.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # 모니터링 스택
  # ─────────────────────────────────────────────────────────────

  tempo:
    profiles: [monitoring]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/perf-config/tempo/tempo.yaml"]
    volumes:
      - perf-config:/perf-config:ro
      - tempo-perf-data:/var/tempo

  cadvisor:
    profiles: [monitoring]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "9080:8080"

  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.8.2
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    restart: always
    command:
      - "--config.file=/perf-config/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=native-histograms"
    volumes:
      - perf-config:/perf-config:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.2.2
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /perf-config/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - perf-config:/perf-config:ro
    ports:
      - "3000:3000"

volumes:
  redis-perf-data:
  mongo-perf-data:
  tempo-perf-data:
  prometheus-data:
  grafana-data:
  postgres-user-perf-data:
  postgres-topic-perf-data:
  postgres-quiz-perf-data:
  postgres-interview-perf-data:
  # 동적 데이터셋 — bake 가 채운 외부 볼륨을 읽기 전용으로 소비 (원격 데몬 상주).
  # 생성: docker volume create hellocs-perf-datasets (run.ps1 이 자동 수행)
  perf-datasets:
    name: hellocs-perf-datasets
    external: true
  # 모니터링 설정 파일 — run.ps1 이 ops/ 에서 원격 볼륨으로 push, bind mount 대체.
  # 생성: docker volume create hellocs-perf-config (run.ps1 이 자동 수행)
  perf-config:
    name: hellocs-perf-config
    external: true

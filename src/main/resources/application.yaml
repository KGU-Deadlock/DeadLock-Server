server:
  port: ${SERVER_PORT}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
spring:
  application:
    name: hellocs
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}
  mongodb:
    uri: ${MONGO_URI}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
kakao:
  app-id: ${KAKAO_APP_ID}
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
management:
  server:
    port: ${MANAGEMENT_PORT}
    address: 0.0.0.0
  endpoints:
    access:
      default: none
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      access: unrestricted
      probes:
        enabled: true
      show-details: never
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: hellocs
  prometheus:
    metrics:
      export:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
ai:
  grading:
    evaluate-endpoint: ${AI_GRADING_EVALUATE_ENDPOINT}
    connect-timeout: ${AI_GRADING_CONNECT_TIMEOUT:2000}
    read-timeout: ${AI_GRADING_READ_TIMEOUT:10000}
  stt:
    transcribe-endpoint: ${AI_STT_TRANSCRIBE_ENDPOINT}
spring:
  datasource:
    url: jdbc:h2:mem:hellocs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/hellocs-test
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/api/v1/auth/token"
            scope:
              - profile_nickname
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: "Q2hhbmdlTWVUb0E1NnRvNjRDaGFyU2VjcmV0S2V5QmFzZTY0IQ=="
  access-token-expiration: 3600000
  refresh-token-expiration: 360000000

ai:
  grading:
    evaluate-endpoint: http://localhost:8000/api/feedback/evaluate
  stt:
    transcribe-endpoint: http://localhost:8000/api/transcribe

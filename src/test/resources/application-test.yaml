spring:
  datasource:
    url: jdbc:h2:mem:hellocs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

  data:
    redis:
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client
            client-secret: test-secret